      if_customer_product_is_excluded: Skip ZK97 and combo, but retain evaluation of ZK95 then ZK94.
      current_fm_behavior: Would also suppress ZK95/ZK94 if they were admitted to the same line selector.

  credit_debit_note_interaction:
    simple_adjustment: Discounted/recarged price becomes PrecioSistema; manual price divergence can generate Z03 or Z08.
    combo_adjustment: Applied during save after cell validation; existing notes are not recalculated against combo price.
    pdt_boundary: PDT promotion priority does not redefine NC/ND reasons; stabilization must prevent promotional recalculation from fabricating price/extension differences.

  implementation_gates:
    - Build one evaluator across combo, percentage, scale, fixed and base price.
    - Select one winning discount and one winning surcharge only if business confirms discount/recargo are independent tracks; PDT wording is ambiguous as written.
    - Encode exclusions as eligibility/fallback, not blanket NOT EXISTS.
    - Support DESCTIPO M or decouple condition class from calculation mechanic.
    - Support CTIPO 1,3,11,12,13,14 consistently and validate A912 visit day.
    - Filter ACTIVO, EMP, invoice effective date and UM.
    - Reconcile promotion recalculation with temporary NC/ND before payment and persistence.

  open_questions:
    - Does exactly one condition mean one discount and one surcharge independently, or one condition total across both families?
    - For DESCTIPO M in ZK95/ZK94, is range 1..1 an eligibility marker or true multiple-only behavior?
    - What ROAD source determines route visit day for A912 during FM/liquidation?
    - Should exclusions also exempt ZR94/ZR95 symmetrically? PDT explicitly names only ZK94/ZK95.
