  pdt_confirmed_rules:
    condition_class_priority:
      discounts:
        1: ZK96_combo
        2: ZK95_percentage
        3: ZK97_scale
        4: ZK94_fixed
      surcharges:
        1: ZR96_combo
        2: ZR95_percentage
        3: ZR97_scale
        4: ZR94_fixed
      invariant: Apply exactly one condition per customer/material, subject to validity.
      fallback: Base price by sales channel if no valid condition applies.
    base_price_channels:
      "01": CADENAS
      "02": GENERALES
      "03": FOOD_SERVICE
      "04": PRICESMART
      "90": PRECIO_BASE_INTERNO_VENDEDORES
    non_combo_access_priority:
      1: sales_org/distribution_channel/sector/customer/material
      2: sales_org/distribution_channel/sector/transport_route/material
      3: sales_org/distribution_channel/sector/customer_group/material
    combo_access_equal_priority:
      - sales_org/distribution_channel/sector/ramo3/commission_group
      - sales_org/distribution_channel/sector/ramo4/commission_group
      - sales_org/distribution_channel/sector/ramo3/ABC/center/group
      - sales_org/distribution_channel/sector/customer/commission_group
      - sales_org/distribution_channel/sector/preventa_route/commission_group
    route_combo_extra_rule: Validate customers assigned to the route and their visit day.
    commission_group: Material sales-master field used to construct and group combo materials.
    exclusions:
      applies_to:
        - ZK96_combo
        - ZR96_combo
        - ZK97_scale
        - ZR97_scale
        - other promotion mechanics except ZK94/ZK95 as explicitly exempted by PDT
      does_not_block:
        - ZK94_fixed_discount
        - ZK95_percentage_discount
      fallback_for_excluded_customer_material:
        - ZK95 when applicable and valid
        - ZK94 when applicable and valid after higher priorities fail
      required_management: [parameterized, auditable, validity_controlled]
      supersedes_previous_assumption: Exclusion does not blanket-block every P_DESCUENTO row.
    road_only_requirements:
      - Fast filter or tab for preventistas to see applicable active promotions.
      - Show base price, applied discounts, and final unit price.
      - Keep customer ticket format unchanged and without prices.
      - Do not add preventive-sales stock validation; commercial policy uses 100 percent open stock.

  current_webapi_mapping:
    ZK94_ZR94: fixed amount, PTIPO=0, PORPORCENTAJE=N, priority_class=4
    ZK95_ZR95: percentage, PTIPO=0, PORPORCENTAJE=S, priority_class=2
    ZK97_ZR97: scale rows, PTIPO=0, ranges, priority_class=3
    ZK96_ZR96: combo header PTIPO=6 DESCTIPO=C plus P_DESCUENTO_COMBO_DET, priority_class=1
    access_sequences:
      A903: CTIPO=1 customer
      A906: CTIPO=3 customer_group
      A907: CTIPO=11 route
      A908: CTIPO=1 customer_combo
      A909: CTIPO=13 ABC plus tipologia and center
      A910: CTIPO=12 ramo3_tipologia
      A911: CTIPO=14 ramo4_pending_in_ROAD
      A912: CTIPO=11 route_combo

  current_fm_mapping_and_gaps:
    line_engine:
      selector: clsLnP_DESCUENTO.Get_Descuento_Recargo
      accepts: CTIPO 0,1,3; PTIPO below 4; exact product; DESCTIPO R; GLOBDESC N
      consequence:
        - A903 and A906 ranges can apply.
        - A907 route is ignored.
        - DESCTIPO M fixed/percentage rows are ignored.
        - PRODUCTO asterisk is ignored.
    combo_engine:
      selector: clsLnP_DESCUENTO.Get_Descuento_Recargo_Aplicable_Cliente
      consequence:
        - A909/A910/A912 may apply.
        - A908 customer combo lacks direct D.CLIENTE=C.CODIGO predicate.
        - A911 has no ROAD customer-field predicate.
      defects:
        - discount and surcharge objects are cross-applied to both combo details
        - calculation is not idempotent
        - update FM does not evaluate combos
        - duplicate product lines are not aggregated
        - detail UM/group/participation semantics are not enforced
    priority_gap: Line and combo conditions are selected separately, so exactly-one-condition is not guaranteed.
    exclusion_gap: Current line DAL blocks all types, including ZK94/ZK95, contrary to PDT fallback rule.
    lifecycle_gaps:
      - ACTIVO is not filtered by FM selectors.
      - EMP is not filtered by FM selectors/detail loader.
      - GETDATE is used instead of invoice effective date.

