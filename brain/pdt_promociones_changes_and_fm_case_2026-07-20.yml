    expected_by_pdt_on_2026_07_20:
      winner: ZK95 coddesc 238
      reason: Valid percentage priority 2 wins over valid scale priority 3; ZK94 is not yet valid.
      expected_effect: 1 percent discount for the customer/material, assuming no higher-priority valid combo.
    expected_by_pdt_from_2026_08_01:
      winner: ZK95 coddesc 238
      reason: ZK95 remains higher priority than newly valid ZK94.
    current_fm_effect:
      winner: ZK97 coddesc 285
      reason: FM hard-filters DESCTIPO R, excluding both ZK95 and ZK94 rows stored as M.
      by_quantity:
        "1": 0.5_percent
        "2": 1.0_percent
        "3_or_more": 1.5_percent
      verdict: noncompliant_with_PDT_priority
