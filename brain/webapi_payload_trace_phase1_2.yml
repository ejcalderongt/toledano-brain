webapi_payload_trace_phase1_2:
  updated_at: 2026-06-03
  branch: devejc-combos-sofos
  objective: >
    Dejar trazabilidad de payloads reales para pruebas de escenarios SAP descuentos/recargos
    en la etapa PDT Promociones Fase 1.2.
  endpoint:
    - POST /api/SapDescuento
    - POST /api/sap/descuentos
    - DELETE /api/sap/descuentos
  payload_folder: ROADWedAPI/payloads/sap_descuentos
  resend_policy:
    field: reemplazarExistente
    value_in_qas_payloads: true
    behavior: >
      WebAPI elimina registros anteriores por CODDESC/llave antes de insertar la nueva
      version del descuento/recargo/combo. Para combos tambien elimina detalle previo en
      P_DESCUENTO_COMBO_DET.
  scenarios:
    - file: 01_zk94_simple_a903.json
      sap_type: ZK94
      access_sequence: A903
      behavior: descuento simple por cliente+material
    - file: 02_zk95_simple_a907.json
      sap_type: ZK95
      access_sequence: A907
      behavior: descuento porcentual por ruta+material
    - file: 03_zk97_escalas_a906.json
      sap_type: ZK97
      access_sequence: A906
      behavior: descuento con escalas por tipo cliente (P_TIPOCLI)+material
    - file: 04_zr95_recargo_a903.json
      sap_type: ZR95
      access_sequence: A903
      behavior: recargo porcentual por cliente+material
    - file: 05_zk96_combo_a908.json
      sap_type: ZK96
      access_sequence: A908
      behavior: combo cliente + grupo comision
    - file: 06_zk96_combo_a909.json
      sap_type: ZK96
      access_sequence: A909
      behavior: combo priorizacion(ABC) + centro + grupo comision
    - file: 07_zk96_combo_a910.json
      sap_type: ZK96
      access_sequence: A910
      behavior: combo tipologia(ramo3) + grupo comision
    - file: 08_zr96_combo_a912.json
      sap_type: ZR96
      access_sequence: A912
      behavior: recargo combo ruta + grupo comision
    - file: 09_delete_por_coddesc.json
      sap_type: N/A
      access_sequence: N/A
      behavior: eliminacion segura por coddesc con confirmacion explicita
    - file: 10_delete_por_llave_a903.json
      sap_type: ZK94
      access_sequence: A903
      behavior: eliminacion segura por llave operativa cliente+producto+vigencia
  warnings:
    - "#EJC20260531 warning(sync-rdc7-descuentos): R1 pendiente de alinear API key RDC7/WebAPI."
  pending_backlog:
    - access_sequence A911 (ramo4) queda pendiente hasta definir mapeo ROAD.
    - Implementar metodo DELETE en el repo fuente WebAPI (este repositorio contiene documentacion/payloads).
