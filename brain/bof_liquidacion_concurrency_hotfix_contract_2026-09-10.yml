diagnosis:
  - P_COLA_LIQUIDACION_V2 serializa el guardado, pero la espera visible tambien puede originarse en carga de inventario temporal o snapshot.
  - Mantener varios turnos por un mismo guardado amplifica bloqueos y registros huerfanos.
  - El heartbeat prueba que la pantalla sigue viva; no prueba avance de la operacion.
  - Ejecutar el snapshot dentro de una transaccion exterior puede prolongar locks y alterar el comportamiento de la sesion.
  - TEMP_STOCK_LIQUIDACION continua siendo staging global compartido y puede generar contencion entre liquidaciones distintas.
  - Un timeout largo limita la espera del usuario, pero no elimina la causa de contencion.

implemented_contract:
  queue:
    - Usar un unico turno tipo 1 para el guardado de liquidacion.
    - Adquirir el turno atomicamente con token de sesion, PID y maquina.
    - Esperar como maximo 120 segundos y emitir COLA_WAIT al inicio y cada 30 segundos.
    - Renovar los turnos adquiridos mediante heartbeat sin solapar ejecuciones del temporizador.
    - Liberar todos los turnos adquiridos en finally y antes de mostrar UI de error o iniciar un reintento.
    - Ante deadlock SQL 1205, reintentar solamente despues de liberar el turno anterior.
  reentry_guards:
    - CargaLiquidacionEnCurso impide dos cargas simultaneas en la misma pantalla.
    - GuardadoLiquidacionEnCurso impide dos guardados simultaneos en la misma pantalla.
    - Restablecer ambos controles aun cuando ocurra excepcion.
  snapshot:
    - FeatureSnapshotLiquidacionV1 permanece deshabilitado en el hotfix publicable.
    - Registrar el motivo de omision o fallback; no confundir snapshot omitido con snapshot exitoso.
  inventory_staging:
    - Validar coherencia entre SqlConnection y SqlTransaction antes de cargar existencias.
    - Reportar subetapas de conexion, creacion de tabla, preparacion de filas, BulkCopy y commit.
    - SqlBulkCopy usa timeout de 30 segundos y convierte timeout en cancelacion controlada con rollback.
    - La tabla TEMP_STOCK_LIQUIDACION sigue siendo global; este hotfix no implementa aislamiento por token.
  observability:
    queue_traces: [COLA_ACQUIRED, COLA_WAIT, COLA_TIMEOUT, COLA_HEARTBEAT_EMPTY, COLA_HEARTBEAT_FAILED, COLA_RELEASED, COLA_RELEASE_FAILED, COLA_REENTRY_BLOCKED, COLA_RETRY_AFTER_RELEASE]
    load_traces: [CARGA_REENTRY_BLOCKED, SNAPSHOT_SKIPPED, SNAPSHOT_FALLBACK, POST_SNAPSHOT]
    recalculation_traces: [RECALCULO_FACTURAS_BEGIN, RECALCULA_FACTURA, POST_RECALCULO_FACTURAS]
    save_traces: [GUARDADO_RELEASE_BEFORE_UI, GUARDADO_COMMIT_BEGIN, GUARDADO_COMMIT_OK, GUARDADO_END]
    inventory_traces: [INV_INSERT_CONEXION, INV_INSERT_CREAR_TABLA, INV_INSERT_PREPARAR_FILAS, INV_INSERT_BULK_COPY, INV_INSERT_BULK_COPY_OMITIDO, INV_INSERT_COMMIT, INV_GRID_DETALLE]
    adjacent_scope: clsD_Factura_DGI incorpora mayor trazabilidad por etapas de certificacion; sirve para separar espera de liquidacion de fallas FEL/DGI.

operational_acceptance:
  minimum_scenario:
    - Ejecutar al menos dos liquidadores concurrentes con liquidaciones y rutas diferentes.
    - Capturar la secuencia completa de adquisicion, heartbeat, guardado, commit y liberacion.
    - Forzar o reproducir timeout, error SQL y deadlock para comprobar liberacion antes de UI o reintento.
    - Verificar que no existan turnos retenidos, facturas duplicadas, inventario cruzado ni liquidaciones parciales.
    - Medir por separado tiempo de recálculo de facturas, otras etapas de guardado y carga de inventario.
  closure_rule: No declarar resuelta la concurrencia solo porque el build pase o el heartbeat continue.

structural_follow_up:
  - Crear staging V2 aislado por token de operacion y filtrar por token todas las lecturas, actualizaciones y borrados.
  - Ejecutar lecturas snapshot fuera de la transaccion de escritura y mantener esta ultima lo mas corta posible.
  - Revisar indices, constraints y dependencias reales de TEMP_STOCK_LIQUIDACION en QAS y PRD.
  - Evaluar READ_COMMITTED_SNAPSHOT solo en QAS y con evidencia de impacto.
  - No eliminar metodos legacy de cola sin validar previamente su grafo de llamadas.

