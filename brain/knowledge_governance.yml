knowledge_governance:
  version: 2
  effective_date: 2026-07-31
  scope: toledano-brain

  session_identification:
    required_before_work: false
    required_for_brain_mutation: true
    prompt: Solicitar nombre completo y DPI solamente antes de crear, modificar, eliminar, versionar o publicar conocimiento del Brain.
    privacy:
      - Normalizar el DPI eliminando espacios y guiones.
      - Comparar solamente su SHA-256 con el registro autorizado.
      - Nunca imprimir, registrar, persistir ni repetir el DPI recibido.
      - La autoidentificacion es un control operativo y no sustituye autenticacion tecnica.
    authorized_people:
      - name: Erik Calderon
        dpi_sha256: 627f0bf78ad38a8cef7f0ce3f8fac8fa8ffbfbd10556d9ba4f51ad5fa587494a
        permissions:
          use_brain: true
          update_brain: true
      - name: Carolina Fuentes
        dpi_sha256: bd0ce0e564bd7d4a41d921037128e09a2aa6074126fc88b6bf69b7355a7ab264
        permissions:
          use_brain: true
          update_brain: false

  mutation_policy:
    owner: Erik Calderon
    default_mode: read_only
    requirements:
      - Erik debe identificarse correctamente antes de la mutacion o publicacion del Brain.
      - Erik debe pedir de forma expresa la actualizacion del conocimiento.
      - Sin ambas condiciones no se crean, modifican, eliminan, versionan ni publican artefactos Brain.
    carolina_scope:
      - Puede consultar y utilizar todo el Brain para trabajo ROAD.
      - Puede analizar, modelar, diagnosticar, probar y cambiar codigo ROAD sin identificacion previa.
      - No puede alterar ni publicar la coleccion de conocimiento Brain.
      - Los nuevos hallazgos quedan como propuesta externa hasta aprobacion expresa de Erik.

  project_identity_policy:
    rule: Verificar identidad del proyecto antes de cargar skills, repositorios o conocimiento auxiliar.
    road_hh_required_signatures:
      remote: https://github.com/carolinakfk/road_2023.git
      package: com.dts.roadp
      source_markers:
        - app/src/main/java/com/dts/roadp/Precio.java
        - app/src/main/java/com/dts/roadp/Venta.java
        - app/src/main/java/com/dts/roadp/ComWS.java
    forbidden_cross_project_inference:
      - No usar TOMHH2025, TOMWMS, TOMIMSV4 ni com.dts.tom como evidencia de ROAD.
      - No activar skills TOMWMS por la sola presencia de Android o HH.
      - Si remoto, paquete y archivos firma no coinciden, detener la inspeccion de ese checkout y buscar el repositorio ROAD correcto.

