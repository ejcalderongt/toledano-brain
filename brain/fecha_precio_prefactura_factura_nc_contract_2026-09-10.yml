risks_and_follow_up:
  - La implementacion fuente esta local y aun no tiene commit en BOF ni HH.
  - La validacion de una sola factura activa no debe depender solo del filtro visual del lookup; validar nuevamente dentro de la transaccion de guardado para evitar concurrencia.
  - La restriccion por unidad de medida no puede inferirse de DS_PEDIDOD porque el esquema observado no contiene UM.
  - Falta prueba funcional conectada a una base con prefacturas reales.
  - El precio base historico por fecha no existe actualmente; el cliente decidio evitar ese esfuerzo por ahora debido a la baja frecuencia de cambios, pero sigue siendo una limitacion conocida.
  - La conservacion de una condicion modificada depende del historial disponible y de la disciplina operativa de no modificar promociones con prefacturas vigentes.
  - Verificar procedimientos, triggers, exportadores e interfaces no cubiertos por las clases inspeccionadas.

handoff_to_anderly:
  recommended_debug_order:
    - Confirmar DS_PEDIDO.FECHA_PRECIO para la prefactura elegida.
    - Confirmar P_RUTA.VENTA=D y FECHAENTR usada por el lookup.
    - Seguir FECHA_PRECIO por formulario, modelo, DAL y tabla D_FACTURA o D_NOTACRED.
    - Comparar consultas P_DESCUENTO y combos contra FECHA_PRECIO, no fecha de factura.
    - Forzar cambio de cantidad o peso y verificar reevaluacion documental completa.
    - Verificar DESPCOREL y ausencia de otra factura activa.
    - Verificar MI3_SAP.FECHA_PRECIO antes del consumo de SOFOS.
  do_not_assume:
    - No restringir productos de NC con DS_PEDIDOD.
    - No hardcodear exclusion de promociones para PriceSmart.
    - No usar GETDATE silenciosamente para una prefactura nueva sin FECHA_PRECIO.
    - No mezclar TOMHH2025, TOMWMS, TOMIMSV4 ni com.dts.tom con ROAD.

