knowledge:
  liquidation_concurrency:
    status: hotfix_local_validated_pending_source_commit_and_operational_validation
    diagnosis:
      - P_COLA_LIQUIDACION_V2 serializa el guardado, pero el bloqueo visible puede ocurrir antes, durante la carga de inventario temporal o el snapshot.
      - Tres turnos simultaneos por guardado amplificaban el bloqueo y dejaban mas registros huerfanos ante cierre o congelamiento.
      - Un heartbeat demuestra que el proceso vive, no que la operacion progresa.
      - usp_LiqVend_CargarSnapshot_v1 ejecutado dentro de la transaccion exterior cambiaba la sesion a READ COMMITTED y retenia el applock hasta el commit exterior.
      - TEMP_STOCK_LIQUIDACION es staging global compartido; SqlBulkCopy puede contender aunque las liquidaciones sean diferentes.
      - Timeouts de 120 segundos prolongan la espera y no corrigen la causa.
    evidence:
      queue_turns_analyzed: 185
      observed_snapshot_timeouts_seconds: [120.050, 120.016]
      observed_long_turns_seconds: [94.386, 123.006, 172.002]
      observed_temp_stock_waits_seconds: [33.549, 48.479]
      affected_liquidations: [390854, 391126, 391231, 391264]
    immediate_hotfix:
      - Usar un unico turno tipo 1 para el guardado.
      - Bloquear atomicamente la reentrada de carga y guardado en una misma pantalla.
      - Liberar el turno antes de reintentar despues de deadlock.
      - Desactivar FeatureSnapshotLiquidacionV1 en el publicable inmediato.
      - Reducir SqlBulkCopy de 120 a 30 segundos.
      - Corregir el procedimiento para no cambiar aislamiento, no abrir transaccion interna y liberar applock de sesion tambien ante error.
    traces: [COLA_ACQUIRED, COLA_RELEASED, COLA_REENTRY_BLOCKED, COLA_RETRY_AFTER_RELEASE, CARGA_REENTRY_BLOCKED]
    structural_follow_up:
      - Ejecutar lecturas snapshot antes de la transaccion de escritura.
      - Mantener la transaccion de escritura lo mas corta posible.
      - Crear staging V2 aislado por token de operacion y filtrar por token todas las lecturas, actualizaciones y borrados.
      - Revisar indices y restricciones reales de TEMP_STOCK_LIQUIDACION en QAS y PRD.
      - Evaluar READ_COMMITTED_SNAPSHOT solo en QAS y con evidencia de impacto.
    rollout_rule: Probar primero con dos liquidadores, liquidaciones y rutas diferentes, y trazas completas; no ampliar hasta confirmar cero timeouts, turnos retenidos, duplicados o inconsistencias.

  promotions_multiple_combos_and_modified_orders:
    status: code_and_build_validated_with_runtime_evidence
    rules:
      - Permitir N combos completos si sus conjuntos de productos son disjuntos.
      - Si dos combos comparten producto, rechazar solo los combos involucrados y conservar cualquier combo independiente.
      - Detectar traslape por codigo de producto, aunque las lineas usen unidades diferentes.
      - Al abrir un pedido modificado conservar la promocion persistida y no recalcular de inmediato.
      - Al editar una linea, reconstruir T_VENTA con la UM comercial dinamica de cada producto mediante app.umStock para venta o app.umStockPV para preventa; usar UM guardada solo como fallback.
      - Despues de una mutacion, reevaluar el documento completo para restaurar correctamente combos e individuales.
    evidence:
      hh_branch_evidence: road_2028_at_cdfde751_during_implementation
      automated_tests: HH_COMBO_MANAGEMENT_OK_cases_13
      android_build: successful_34_tasks
      runtime_cases:
        - combo 677 completo para productos 0071 y 0003 aplico 15 por ciento.
        - combo 675 para 0492 y 0402 exigia 50 UN de 0492; con 5 UN el rechazo era parametrico, no conflicto entre combos.
        - Al editar 0492, copiar UMVENTA a UMSTOCK hacia que otras lineas acumularan cero; recuperar UM comercial corrigio la reevaluacion.
    traces: [PROMO_MODIFIED_ORDER_PRESERVED, PROMO_MODIFIED_ORDER_LINE_REBUILT, PROMO_COMBO_SELECTED, COMBO_SELECTION_OVERLAP, PROMO_DOCUMENT_REEVALUATED]

