problem:
  event: user_edits_line_weight
  quantity_boxes: 3
  edited_total_weight: 41.399
  observed_wrong_selection:
    range_basis: 41.399
    selected_percent: 3.9
    total_final: 61.93
    derived_unit_price: 1.495930
  impact: >
    El peso editado era enviado en el parametro Cantidad de Get_Descuento_Recargo.
    Como la condicion usa UMVENTA=CA, el DAL evaluaba 41.399 contra las escalas de
    cajas y seleccionaba el rango 5..999999 en lugar del rango exacto de 3 cajas.

confirmed_rule:
  selection_basis: >
    La base para seleccionar una escala se resuelve por la UM de la condicion.
    Para CODDESC 376 con UMVENTA=CA, Cantidad debe conservar el numero de cajas.
  calculation_basis: >
    Si la linea ROAD se factura por peso, el peso editado representa el peso total
    extendido y se usa como base monetaria. No se multiplica nuevamente por cantidad.
  authoritative_value: total_final_extended_line
  derived_value: promotional_unit_price_at_6_decimals
  forbidden:
    - usar_peso_editado_como_parametro_Cantidad
    - reconstruir_total_desde_precio_unitario_redondeado_a_2_decimales

