bitacora:
  - date: 2026-04-06
    type: acceso_seguridad
    actor: Alicia Rivas / equipo seguridad
    summary: Se eleva caso a mesa de ayuda por acceso y luego se confirma acceso otorgado para pruebas.
    impact: Habilita continuidad de validaciones de integracion.
    status: cerrado

  - date: 2026-04-13
    type: aclaracion_funcional
    actor: Erik Calderon -> Alicia Rivas
    summary: ROAD solicita aclarar si combos son independientes o si existe combo combinado adicional.
    impact: Se identifica riesgo de interpretacion en logica de combos.
    status: cerrado

  - date: 2026-04-13
    type: respuesta_negocio
    actor: Alicia Rivas
    summary: "Se indica que el combo combinado requiere desarrollo ABAP SOFOS y no es estandar SAP; ejemplo: producto 1 + producto 2 + producto 3 otorga porcentaje."
    impact: Se confirma participacion de SOFOS en reglas/campos clave.
    status: cerrado

  - date: 2026-04-23
    type: definicion_negocio
    actor: Alicia Rivas
    summary: Negocio comparte definicion funcional y parametrizacion para combos.
    impact: ROAD valida posibilidad de integrar con API actual.
    status: cerrado

  - date: 2026-04-24
    type: validacion_road
    actor: Erik Calderon
    summary: ROAD interpreta inicialmente combo como condicion global, cantidad minima, grupo A y descuento sobre total.
    impact: Se solicita confirmar alcance del descuento, cantidades y concurrencia.
    status: corregido_por_respuesta_posterior

  - date: 2026-04-24
    type: aclaracion_negocio
    actor: Alicia Rivas
    summary: Se confirma que las cantidades son minimas y que todos los combos van a productos especificos.
    impact: "Cambia modelo de aplicacion: beneficio no debe tratarse como total global del pedido."
    status: cerrado

  - date: 2026-04-27
    type: concurrencia_promociones
    actor: Erik Calderon / Alicia Rivas
    summary: "Se plantea necesidad de definir regla de concurrencia: acumulativo, exclusivo, prioridad o mixto."
    impact: Pendiente de decision de negocio en ese momento.
    status: resuelto_por_prioridad_posterior

  - date: 2026-05-07
    type: cambio_requerimiento
    actor: Alicia Rivas
    summary: Se informa que luego de sesiones con usuarios se requieren ajustes al requerimiento inicial y que el impacto debe evaluarse/aprobarse formalmente.
    impact: Genera ampliacion de alcance para combos, prioridades, excepciones y campos adicionales.
    status: requiere_implementacion

  - date: 2026-05-08
    type: jerarquia_sap_combo
    actor: Sara Najera
    summary: SOFOS aclara que SAP valida combinaciones de combo por jerarquia A908, A909, A910, A911, A912 y toma el primer registro aplicable.
    impact: ROAD debe mapear ctipo/cliente segun combinacion y no asumir igualdad real de prioridad funcional SAP.
    status: cerrado_para_sap_pendiente_road

  - date: 2026-05-08
    type: no_repeticion_materiales_combo
    actor: Alicia Rivas
    summary: Negocio confirma que los materiales configurados en grupos de imputacion/combo no se van a repetir.
    impact: Reduce riesgo de conflicto por traslapes entre combos.
    status: cerrado

  - date: 2026-05-08
    type: propuesta_mapeo_road
    actor: Sara Najera / Erik Calderon
    summary: Se propone enviar todas las combinaciones de combo con Ind.Jerarq=1 y diferenciar con Ctipo y P_DESCUENTO.Cliente.
    impact: ROAD requiere nuevos Ctipo 4, 5 y 6 para A909, A910 y A911.
    status: parcialmente_confirmado

  - date: 2026-05-08
    type: notas_credito
    actor: Carolina Fuentes -> Alicia Rivas
    summary: Se consulta si descuentos y recargos de combos aplican en notas de credito.
    impact: Define alcance de facturacion/notas.
    status: respondido

  - date: 2026-05-10
    type: notas_credito_respuesta
    actor: Alicia Rivas
    summary: No debe considerarse para notas excepto las que se manejan por error en precio.
    impact: Excluir combos de notas de credito ordinarias.
    status: cerrado

  - date: 2026-05-19
    type: aprobacion_comercial
    actor: Productos Toledano
    summary: Se emite orden de compra 4500337393 por Promociones Fase 1.1 por 11,556.00.
    impact: Respalda ejecucion comercial del alcance aprobado.
    status: cerrado

  - date: 2026-05-20
    type: propuesta_economica
    actor: DTSolutions Panama
    summary: Propuesta/orden de venta OV11177 por 216 horas de servicios profesionales de desarrollo, total 11,556.00.
    impact: Base economica para plan de trabajo.
    status: cerrado

  - date: 2026-06-02_to_2026-07-08
    type: plan_trabajo
    actor: DTSolutions / ROAD
    summary: PDT define plan de trabajo promociones combos, incluyendo BOF, HH, interface, pruebas unitarias e integrales.
    impact: Roadmap de implementacion y pruebas.
    status: planificado

  - date: 2026-06-01
    type: actualizacion_codigo_webapi
    actor: Erik Calderon / Codex
    summary: Se actualiza WebAPI para version funcional 1.2 en Swagger y se corrige DESCTIPO para usar solo R (rangos) y M (multiplos), desacoplando la semantica de combo a PTIPO=6.
    impact: Alinea contrato SAP-ROAD con regla de negocio real de TOLEDANO y evita interpretaciones legacy S/C en P_DESCUENTO.
    status: implementado_en_devejc-combos-sofos
    technical_trace:
      branch: devejc-combos-sofos
      files:
        - ROADWedAPI/Program.cs
        - ROADWedAPI/DTOS/SapDescuentoRequest.cs
        - ROADWedAPI/SAP/Descuentos/SapDescuentoMapper.cs
        - ROADWedAPI/Controllers/SapDescuentoController.cs
        - ROADWedAPI/payloads/sap_descuentos/CATALOGO_ESCENARIOS.md

  - date: 2026-06-08
    type: optimizacion_rendimiento_liquidacion
    actor: Erik Calderon / Codex
    summary: Se realiza traza fina de frmLiqVend y se implementa optimizacion set-based en Guarda_Liquidacion para evitar updates por fila en tablas de documentos e inventario.
    impact: Reduce roundtrips por liquidacion, disminuye tiempo de cierre y baja probabilidad de deadlock bajo concurrencia de multiples liquidadores.
    status: implementado_en_devejc-combos-sofos
    technical_trace:
      branch: devejc-combos-sofos
      files:
        - Formas/Procesos/frmLiqVend.vb
        - road_toledano_agent_setup/fine_trace_liquidacion_frmLiqVend_2026-06-08.md
        - road_toledano_agent_setup/sql/proposal_sp_liquidacion_batch_v1.sql

  - date: 2026-06-08
    type: optimizacion_concurrencia_espera_liquidacion
    actor: Erik Calderon / Codex
    summary: Se elimina la espera recursiva en frmLiqVend para los turnos CT de buscar/cargar/guardar, migrando a loop iterativo con logica comun para reducir sobrecosto y riesgo de reentrada.
    impact: Mejora estabilidad bajo multiples liquidadores concurrentes y reduce latencia de espera activa; deja base para mover control de turnos a SP atomico.
    status: implementado_en_devejc-combos-sofos
    technical_trace:
      branch: devejc-combos-sofos
      files:
        - Formas/Procesos/frmLiqVend.vb
        - road_toledano_agent_setup/sql/proposal_sp_cola_transacciones_wait_v1.sql
        - road_toledano_agent_setup/fine_trace_liquidacion_frmLiqVend_2026-06-08.md

  - date: 2026-06-08
    type: despliegue_bd_qas_prd_optimizacion_cola
    actor: Erik Calderon / Codex
    summary: Se despliegan en QAS y PRD los SPs/TVP/indice para cola de transacciones y guardado batch; se corrige compatibilidad de bloqueos removiendo READPAST en lectura con HOLDLOCK de TryAcquire.
    impact: Estructuras de concurrencia y batch quedan alineadas entre ROADSAP_QAS y ROADSAP, listas para integrar desde BOF con menor roundtrip.
    status: implementado_en_qas_y_prd
    technical_trace:
      qas:
        server: 172.16.10.27
        db: ROADSAP_QAS
      prd:
        server: 172.16.10.9
        db: ROADSAP
      scripts:
        - road_toledano_agent_setup/sql/proposal_sp_liquidacion_batch_v1.sql
        - road_toledano_agent_setup/sql/proposal_sp_cola_transacciones_wait_v1.sql

  - date: 2026-06-08
    type: diagnostico_prd_rendimiento_concurrencia
    actor: Erik Calderon / Codex
    summary: Se ejecuta diagnostico no invasivo en ROADSAP (PRD) con DMVs y script Python para identificar cuellos de botella, demanda e indices faltantes en procesos de liquidacion.
    impact: Se confirma cuello principal en updates por CODIGOLIQUIDACION sobre inventario; se deja propuesta de tuning de indices para rollout controlado QAS->PRD.
    status: analisis_completado_pendiente_ejecucion_indices
    technical_trace:
      prd:
        server: 172.16.10.9
        db: ROADSAP
      artifacts:
        - road_toledano_agent_setup/tools/sql_perf_diagnose.py
        - road_toledano_agent_setup/sql/diagnostico_prd_roadsap_2026-06-08.md
        - road_toledano_agent_setup/sql/diagnostico_prd_roadsap_2026-06-08.json
        - road_toledano_agent_setup/sql/diagnostico_prd_resumen_2026-06-08.md
        - road_toledano_agent_setup/sql/proposal_index_tuning_liquidacion_prd_qas_v1.sql

  - date: 2026-06-08
    type: despliegue_indices_qas_prd_liquidacion
    actor: Erik Calderon / Codex
    summary: Se aplican en QAS y PRD los indices propuestos para optimizar updates por CODIGOLIQUIDACION y operaciones de cola de transacciones.
    impact: Mejora base para reducir scans y latencia en limpieza/guardado de liquidacion bajo concurrencia.
    status: implementado_en_qas_y_prd
    technical_trace:
      qas:
        server: 172.16.10.27
        db: ROADSAP_QAS
        elapsed_ms: 2094
      prd:
        server: 172.16.10.9
        db: ROADSAP
        elapsed_ms: 2831
      script:
        - road_toledano_agent_setup/sql/proposal_index_tuning_liquidacion_prd_qas_v1.sql
      indexes:
        - IX_P_INVENTARIO_BARRAS_RUTA_CODLIQ_NZ
        - IX_P_INVENTARIO_RUTA_CODLIQ
        - IX_D_DEPOS_CODLIQ
        - IX_P_COLA_TRANSACCIONES_USR_PROC
      notes:
        - Se agrego SET QUOTED_IDENTIFIER ON al script para compatibilidad de creacion.

  - date: 2026-07-10
    type: correccion_descuentos_webapi
    actor: Erik Calderon / Codex
    summary: Se implementan TWA002 para rangos de descuentos por multiplo y TWA003 para validar combos A912 por Ruta sin exigir Tipologia de A910.
    impact: Los multiplos quedan aplicables en ROAD y los combos A912 respetan su llave comercial por Ruta sin alterar los flujos A910 ni los descuentos por rango.
    status: implementado_y_validado_localmente
    technical_trace:
      branch: devejc-combos-sofos
      cases:
        - TWA002
        - TWA003
      files:
        - ROADWedAPI/SAP/Descuentos/SapDescuentoMapper.cs
        - ROADWedAPI/Controllers/SapDescuentoController.cs
      validation:
        - Build WebAPI correcto con 0 errores.
        - TWA003 reproducido antes del fix con HTTP 400 incorrecto de A910.
        - Despues del fix A912 avanzo por Ruta hasta la validacion independiente de UMVENTA KI no homologada.
        - No se persistio la condicion del payload TWA003; se registraron trazas de integracion.

  - date: 2026-07-17
    type: exclusiones_cliente_producto_webapi
    actor: Erik Calderon / Codex
    summary: Se agrega al WebAPI de ROAD el flujo de desactivacion logica para exclusiones cliente-producto con endpoint DELETE y traza SAP estandar.
    impact: La pareja cliente-producto excluida puede darse de baja sin borrar fisicamente la fila y manteniendo el mismo sobre de respuesta SAP/ROAD.
    status: implementado_en_devejc-combos-sofos
    technical_trace:
      branch: devejc-combos-sofos
      files:
        - ROADWedAPI/Controllers/SapExclusionDescuentoController.cs
        - ROADWedAPI/DTOS/SapExclusionDescuentoDtos.cs
        - ROADWedAPI/Models/PClienteProdExcluido.cs
        - ROADWedAPI/Models/SapIntegrationTrace.cs
      notes:
        - El DELETE usa Confirmacion=ELIMINAR y desactiva por cliente+producto.
        - La prueba local quedo bloqueada por timeout en validacion SQL, pero la respuesta se devolvio en contrato estandar con success=false y código 503.
