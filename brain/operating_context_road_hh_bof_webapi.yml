operating_context:
  updated_at: 2026-06-01
  objective: >
    Contexto operativo unificado para promociones/descuentos ROAD en Toledano,
    alineando HH Android, WebService RDC7, BOF WinForms, SQL Server y WebAPI SAP.

  repositories:
    bof_and_webservice:
      path: C:/Users/yejc2/source/repos/ROAD_TOLEDANO
      branch: devejc-combos-sofos
      components:
        - BOF_ROAD (.NET Framework 4.8 WinForms)
        - RDC7 (wsAndr.asmx para sincronizacion HH)
        - ROADWedAPI (.NET WebAPI para integracion SAP descuentos)
    hh_android:
      path: C:/Users/yejc2/source/repos/road_hh_toledano
      branch: dev_road_2026
      verified_commit: b3ebe72
      components:
        - app Android (SQLite local + consumo SOAP)

  runtime_flow:
    - step: 1
      name: sincronizacion_hh_bajo_demanda
      source: RDC7/wsAndr
      destination: BD local SQLite en HH
      trigger: menu Comunicacion en HH
      notes:
        - HH descarga catalogos y promociones vigentes (ej. P_DESCUENTO).
        - Opera desconectado sobre copia local.
    - step: 2
      name: operacion_rutero_offline
      source: BD local HH
      destination: transacciones locales (pedidos/facturas/cobros)
      trigger: jornada operativa
      notes:
        - Calculo de descuentos/recargos se ejecuta en HH con data local.
    - step: 3
      name: envio_transacciones_hh
      source: HH
      destination: BOF/RDC7
      trigger: comunicacion manual o proceso fin de dia
      notes:
        - Fin de dia valida comunicacion pendiente antes de cierre.
    - step: 4
      name: integracion_sap_descuentos
      source: SAP/SOFOS
      destination: ROADWedAPI
      trigger: POST endpoint SAP descuentos
      notes:
        - WebAPI debe digerir formato SAP semi-homologado y transformarlo a ROAD.
        - Persistencia operativa objetivo en P_DESCUENTO y P_DESCUENTO_COMBO_DET.

  technical_constraints:
    - HH depende de datos vigentes precargados; no consulta descuentos online por item.
    - Cualquier cambio en estructura de P_DESCUENTO requiere compatibilidad HH + RDC7 + BOF + WebAPI.
    - Integracion SAP documentada con autenticacion X-API-KEY y respuesta estandar.

  functional_priority_rules:
    discounts:
      - ZK96
      - ZK95
      - ZK97
      - ZK94
    surcharges:
      - ZR96
      - ZR95
      - ZR97
      - ZR94
    rule: aplicar una sola condicion vigente por material/cliente segun prioridad.
