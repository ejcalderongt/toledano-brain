  critical_risks:
    - id: R1
      title: desalineacion de columnas descuento entre RDC7 y HH
      impact: alto
      detail: >
        RDC7 sigue exportando estructura antigua de P_DESCUENTO mientras HH y BD local ya operan
        con ES_RECARGO/PORPORCENTAJE/PRIORIDAD.
    - id: R2
      title: combo global vs combo por producto
      impact: alto
      detail: Mapper WebAPI usa Globdesc='S' pero negocio confirmo beneficio sobre productos especificos.
    - id: R3
      title: autenticacion no implementada segun estandar
      impact: medio
      detail: Documentacion exige X-API-KEY; Program.cs no registra handler real.
    - id: R4
      title: mapeos A909/A910/A911 incompletos
      impact: alto
      detail: Falta aterrizar campos maestros y ctipo extendidos para combinaciones combo.
    - id: R5
      title: catalogos hardcodeados CTIPO/PTIPO no alineados entre componentes
      impact: alto
      detail: >
        CTIPO (0..14) y PTIPO (0..5 legado) son valores fijos en BOF/HH. La introduccion de
        PTIPO=6 para combo requiere ajuste coordinado en WebAPI, BOF, RDC7 y HH.
